name: Claude PR Review
on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.REVIEW_GH_TOKEN || secrets.GITHUB_TOKEN }}
          claude_args: --model claude-sonnet-5 --max-turns 10 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Rules: CLAUDE.md, WORKFLOW.md and docs/playbook/BACKEND_STANDARDS.md.
            Check: bugs, whether the PR description's requirement is met, sendOk/sendCreated + HttpError (no hand-rolled res.status().json), Zod validation, no unasked migrations, comments max 2 lines.
            Only read changed files plus what they directly need. Report real issues only, no nitpicks.
            Post inline comments for specific lines, then one short summary comment.
