services:
  redis:
    image: redis:7-alpine
    container_name: redis-prd
    restart: always
    command: redis-server --appendonly yes
    # No published port: Redis has no password, and the app reaches it over the compose network.
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
      start_period: 5s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  app:
    image: harhsitsharma/cms-backend:${IMAGE_TAG:-latest}
    container_name: cms-backend-app
    restart: always
    ports:
      - '5000:5000'
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - APP_VERSION=${IMAGE_TAG:-latest}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5000
      - ENABLE_LOGIN_ALERTS_QUEUE=true
      # Heap under mem_limit, leaving room for Chromium (PDFs) outside the heap.
      - NODE_OPTIONS=--max-old-space-size=1536
      # Clear any AWS credential env vars from .env so the SDK
      # falls back to EC2 IAM role credentials via Instance Metadata.
      - AWS_ACCESS_TOKEN=
      - AWS_SECRET_TOKEN=
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5000/ || exit 1
      interval: 30s
      retries: 3
      start_period: 40s
    # t3.medium has 4 GB: cap the app so a leak gets it restarted, not the host starved.
    mem_limit: 3g
    # Ships to CloudWatch via the instance role; non-blocking so a CloudWatch outage or the $3 budget deny drops lines instead of freezing the app.
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /infinity-medisetu/prod
        tag: '{{.Name}}-{{.ID}}'
        mode: non-blocking
        max-buffer-size: 4m

volumes:
  redis-data:
