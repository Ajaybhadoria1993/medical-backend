services:
  redis:
    image: redis:7-alpine
    container_name: redis-stg
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data-stg:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file

  app:
    image: harhsitsharma/cms-backend:${IMAGE_TAG:-staging}
    container_name: cms-backend-app-stg
    restart: always
    ports:
      - "5002:5000"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: staging
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 5000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5000/ || exit 1
      interval: 30s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file

volumes:
  redis-data-stg: