services:
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '6380:6379'
    volumes:
      - redis-data-dev:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
      start_period: 5s
    logging:
      driver: 'json-file'

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cms-backend-app-dev
    restart: always
    ports:
      - '5000:5000'
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5000/ || exit 1
      interval: 30s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'

volumes:
  redis-data-dev:
